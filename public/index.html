<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sakeena — Coming Soon</title>
  <style>
    body { margin: 0; background: #111f11; color: #f1f5f0; font-family: -apple-system, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    h1 { font-size: 2rem; font-weight: 700; }
    p  { color: #5a875a; font-size: 1rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div>
    <h1>سكينة · Sakeena</h1>
    <p>Coming soon.</p>
  </div>
  <script>
    const hash = window.location.hash;
    if (hash) {
      const params = new URLSearchParams(hash.substring(1));
      const type = params.get('type');
      if (type === 'recovery') {
        window.location.href = 'sakeena://reset-password' + hash;
      } else if (type === 'signup') {
        window.location.href = 'sakeena://confirm-email' + hash;
      }
    }
  </script>
</body>
</html>
